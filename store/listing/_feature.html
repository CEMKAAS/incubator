<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_fonts.css">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(90% 120% at 100% 0%,#4F9A72 0%,rgba(79,154,114,0) 55%),radial-gradient(70% 90% at 0% 100%,#1E3328 0%,rgba(30,51,40,0) 60%),#3F7D5C;font-family:Inter,sans-serif;position:relative;color:#fff}
.egg{position:absolute;border-radius:50%/60% 60% 40% 40%;opacity:.14;background:#CDEDA3}
.e1{width:380px;height:460px;left:-140px;top:-120px;transform:rotate(-20deg)}
.e2{width:220px;height:270px;right:420px;bottom:-140px;transform:rotate(16deg);background:#FBF1DA}
.text{position:absolute;left:64px;top:96px;width:440px;z-index:2}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:#CDEDA3;font-weight:600;margin-bottom:18px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:70px;line-height:1;margin:0 0 20px;letter-spacing:-.01em}
p{font-size:20px;line-height:1.35;color:rgba(255,255,255,.82);margin:0;font-weight:500}
.phone{position:absolute;width:250px;aspect-ratio:1080/2400;border-radius:34px;background:#1B2A22;padding:8px;box-sizing:border-box;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.phone .screen{width:100%;height:100%;border-radius:27px;overflow:hidden;background:#000}
.phone img{width:100%;display:block}
.p1{right:250px;top:80px;transform:rotate(-6deg)}
.p2{right:50px;top:140px;transform:rotate(4deg)}
</style></head><body>
<div class="egg e1"></div><div class="egg e2"></div>
<div class="text"><div class="eyebrow">Учёт инкубации</div><h1>Инкубатор</h1><p>Закладки, режим по дням, замеры, овоскопирование, статистика и финансы — всё на телефоне, без интернета.</p></div>
<div class="phone p1"><div class="screen"><img src="../screenshots/02_incubator.png"></div></div>
<div class="phone p2"><div class="screen"><img src="../screenshots/03_batch_today.png"></div></div>
</body></html>
