[versions]
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.11"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
room = "2.8.4"
work = "2.11.2"
kotlinxCoroutines = "1.11.0"
uiTextGoogleFonts = "1.12.0"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRules = "1.7.0"
testRunner = "1.7.0"
# Только для JVM-тестов :app: на устройстве org.json даёт сама платформа, а в юнит-тестах
# android.jar — заглушка, и без этой библиотеки кодек файла закладки проверить нечем.
orgJson = "20250517"

mobileads = "8.2.0"
appmetrica = "8.5.1"

# SDK RuStore. Обновление и оценка выпускаются одним рядом версий и одной BOM
# (ru.rustore.sdk:bom), пуши — своим: их 7.x и 10.x ровесники, а не отставание.
# Внутрь обе линии тянут ru.rustore.sdk:core, и Gradle сведёт его к старшей —
# 10.5.0 против 8.0.0 у пушей; проверено, что старшая ничего из младшей не убрала.
rustore = "10.5.1"
rustorePush = "7.4.1"

# QR-код инкубатора: CameraX даёт кадры с камеры, ZXing кодирует и распознаёт сам код.
# ZXing — чистая Java без Google Play services, чего требует сборка для RuStore:
# ML Kit на телефоне без сервисов Google молчал бы, а офлайн-приложению нужен
# сканер, который работает везде, где есть камера.
camerax = "1.6.1"
zxing = "3.5.4"

# Вход через VK ID. Только ядро SDK, без готовой кнопки One Tap (`onetap-compose`): та
# тянет Coil, мультибрендинг и подписку на сообщество — полмегабайта ради одной кнопки,
# которую экран профиля рисует сам. Лежит не в Maven Central, а в репозитории VK —
# см. settings.gradle.kts.
vkid = "2.7.3"
# Та же версия, что уже приезжает в APK вместе с AppMetrica (analytics-network-okhttp):
# объявлена явно только потому, что её напрямую зовёт account/AccountApi.
okhttp = "4.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "uiTextGoogleFonts" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

mobileads = { module = "com.yandex.android:mobileads", version.ref = "mobileads" }
appmetrica = { module = "io.appmetrica.analytics:analytics", version.ref = "appmetrica" }

rustore-appupdate = { module = "ru.rustore.sdk:appupdate", version.ref = "rustore" }
rustore-review = { module = "ru.rustore.sdk:review", version.ref = "rustore" }
rustore-pushclient = { module = "ru.rustore.sdk:pushclient", version.ref = "rustorePush" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

vkid = { module = "com.vk.id:vkid", version.ref = "vkid" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
