room = "2.8.4"
work = "2.11.2"
kotlinxCoroutines = "1.11.0"
uiTextGoogleFonts = "1.12.0"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

mobileads = "8.3.0"
appmetrica = "8.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
